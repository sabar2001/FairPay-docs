<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="FairPay Bill Split">
  <meta property="og:description" content="View a shared bill split from FairPay.">
  <meta property="og:type" content="website">
  <title>FairPay — Shared Split</title>
  <script src="./share-config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --fg: #ffffff;
      --muted: #94a3b8;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.1);
      --brand: #818cf8;
      --accent: #ffffff;
      --accent-fg: #000000;
      --palette: #818cf8, #34d399, #fbbf24, #fb7185, #38bdf8, #c084fc, #2dd4bf, #fb923c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      min-height: 100vh;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }
    .logo {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .kicker {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .total {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1px;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }
    .bar {
      display: flex;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .person-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .person-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 18px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .person-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .amount {
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
    }
    .items-title {
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 24px 0 12px;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
    }
    .item-row:last-child { border-bottom: none; }
    .item-assignees {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }
    .cta-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 28px;
    }
    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 600;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
    }
    .btn-secondary {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .state {
      text-align: center;
      padding: 48px 0 24px;
      color: var(--muted);
    }
    .state h1 {
      color: var(--fg);
      font-size: 22px;
      margin: 0 0 8px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">FairPay</div>

    <div id="loading" class="state">
      <h1>Loading split…</h1>
      <p>Fetching the shared bill.</p>
    </div>

    <div id="error" class="state hidden">
      <h1>Split not found</h1>
      <p>This link may be invalid or no longer available.</p>
      <div class="cta-stack">
        <a id="error-app-store" class="btn btn-primary" href="#">Download on the App Store</a>
      </div>
    </div>

    <div id="content" class="hidden">
      <div class="hero">
        <div class="kicker">TOTAL OWED</div>
        <div class="total" id="grand-total">$0.00</div>
        <div class="meta" id="bill-meta"></div>
        <div class="bar" id="proportion-bar"></div>
      </div>

      <div id="people"></div>

      <div class="items-title">Items</div>
      <div class="card" id="items"></div>

      <div class="cta-stack">
        <a id="open-app" class="btn btn-primary" href="#">Open in FairPay</a>
        <a id="app-store" class="btn btn-secondary" href="#">Download on the App Store</a>
      </div>
    </div>
  </div>

  <script>
    const palette = ['#818CF8', '#34D399', '#FBBF24', '#FB7185', '#38BDF8', '#C084FC', '#2DD4BF', '#FB923C'];
    const config = window.FAIRPAY_SHARE_CONFIG || {};
    const params = new URLSearchParams(window.location.search);
    const token = (params.get('t') || '').trim();
    const pageUrl = token
      ? `${config.docsBaseUrl || window.location.origin}/s.html?t=${encodeURIComponent(token)}`
      : window.location.href;

    function formatDollars(cents) {
      return '$' + (cents / 100).toFixed(2);
    }

    function formatDollarsFromPrice(price) {
      return '$' + Number(price).toFixed(2);
    }

    function show(id) {
      ['loading', 'error', 'content'].forEach((section) => {
        document.getElementById(section).classList.toggle('hidden', section !== id);
      });
    }

    function assigneeNames(item, peopleById) {
      const ids = item.assignedToIds || [];
      if (!ids.length) return 'Unassigned';
      return ids.map((id) => peopleById[id]?.name || 'Unknown').join(', ');
    }

    function renderSplit(payload) {
      const people = payload.people || [];
      const items = payload.items || [];
      const billMeta = payload.billMeta || {};
      const peopleById = Object.fromEntries(people.map((p) => [p.id, p]));
      const grandTotalCents = payload.grandTotalCents
        ?? people.reduce((sum, p) => sum + (p.currentTotalCents || 0), 0);

      document.getElementById('grand-total').textContent = formatDollars(grandTotalCents);
      document.getElementById('bill-meta').textContent =
        `Subtotal ${formatDollars(billMeta.subtotalCents || 0)} · Tax ${formatDollars(billMeta.taxCents || 0)} · Tip ${formatDollars(billMeta.tipCents || 0)}`;

      const bar = document.getElementById('proportion-bar');
      bar.innerHTML = '';
      people.forEach((person, index) => {
        if (!person.currentTotalCents) return;
        const segment = document.createElement('div');
        segment.style.flex = String(person.currentTotalCents);
        segment.style.background = palette[index % palette.length];
        bar.appendChild(segment);
      });

      const peopleEl = document.getElementById('people');
      peopleEl.innerHTML = '';
      people.forEach((person, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        const count = person.assignedItems?.length || 0;
        card.innerHTML = `
          <div class="person-row">
            <div>
              <div class="person-name">
                <span class="dot" style="background:${palette[index % palette.length]}"></span>
                <span style="color:${palette[index % palette.length]}">${person.name}</span>
              </div>
              <div class="person-meta">${count} ${count === 1 ? 'item' : 'items'} assigned</div>
            </div>
            <div class="amount">${formatDollars(person.currentTotalCents || 0)}</div>
          </div>`;
        peopleEl.appendChild(card);
      });

      const itemsEl = document.getElementById('items');
      itemsEl.innerHTML = '';
      items.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div>
            <div>${item.name}${item.quantity > 1 ? ` × ${item.quantity}` : ''}</div>
            <div class="item-assignees">${assigneeNames(item, peopleById)}</div>
          </div>
          <div>${formatDollarsFromPrice(item.price)}</div>`;
        itemsEl.appendChild(row);
      });

      document.getElementById('open-app').href = pageUrl;
      document.getElementById('app-store').href = config.appStoreUrl;
      document.querySelector('meta[property="og:title"]').content =
        `FairPay Split — ${formatDollars(grandTotalCents)}`;
      show('content');
    }

    async function loadSplit() {
      const appStoreUrl = config.appStoreUrl || 'https://apps.apple.com/app/id6761960918';
      document.getElementById('error-app-store').href = appStoreUrl;
      document.getElementById('app-store').href = appStoreUrl;

      if (!token) {
        show('error');
        return;
      }

      const supabaseUrl = config.supabaseUrl;
      const anonKey = config.supabaseAnonKey;
      if (!supabaseUrl || !anonKey || supabaseUrl.includes('REPLACE_WITH')) {
        show('error');
        return;
      }

      try {
        const response = await fetch(
          `${supabaseUrl}/functions/v1/get-shared-split?t=${encodeURIComponent(token)}`,
          { headers: { apikey: anonKey } },
        );
        if (!response.ok) throw new Error('not found');
        const data = await response.json();
        if (!data?.payload) throw new Error('invalid payload');
        renderSplit(data.payload);
      } catch {
        show('error');
      }
    }

    loadSplit();
  </script>
</body>
</html>
