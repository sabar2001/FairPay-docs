<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Opening FairPay…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    p { color: #a1a1aa; max-width: 360px; line-height: 1.5; }
    a { color: #5b9dff; }
  </style>
</head>
<body>
  <div id="status">
    <p>Opening FairPay…</p>
  </div>
  <script>
    (function () {
      var hash = window.location.hash;
      var status = document.getElementById('status');

      if (!hash || hash.length < 2) {
        status.innerHTML =
          '<p>This confirmation link is invalid or has expired. Open FairPay and try signing in, or request a new confirmation email.</p>';
        return;
      }

      var appUrl = 'fairpay://auth-callback' + hash;
      window.location.replace(appUrl);

      setTimeout(function () {
        status.innerHTML =
          '<p>If FairPay did not open automatically, <a href="' +
          appUrl +
          '">tap here to open the app</a>. Make sure FairPay is installed.</p>';
      }, 2500);
    })();
  </script>
</body>
</html>
